<div class="wrap">
  <h1>rec</h1>

  <h2>ã¢ããª</h2>
  <div class="card" id="apps"></div>
  <div class="bar">
    <button class="primary" id="start">é¸æããã¢ããªãé²é³</button>
    <button class="ghost" id="reload">åèª­ã¿è¾¼ã¿</button>
  </div>

  <h2>é²é³ä¸­</h2>
  <div class="card" id="tracks"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sel = new Set();

async function j(url){ return (await fetch(url)).json(); }

async function refresh(){
  try{
    const [p, i] = await Promise.all([j('/processes'), j('/info')]);
    sel.forEach(id => { if(!p.processes.some(x => x.objectID === id)) sel.delete(id); });

    $('#apps').innerHTML = p.processes.length ? p.processes.map(x => `
      <div class="row" data-id="${x.objectID}">
        <input type="checkbox" ${sel.has(x.objectID)?'checked':''}>
        <span class="name">${esc(x.name)}</span>
        ${x.runningOutput?'<span class="badge live">playing</span>':''}
        ${x.tracked?'<span class="badge">rec</span>':''}
        <span class="dim">${x.objectID}</span>
      </div>`).join('') : '<div class="empty">é³ãåºãã¦ããã¢ããªãããã¾ãã</div>';

    $('#tracks').innerHTML = i.tracks.length ? i.tracks.map(t => `
      <div class="row rec" data-id="${t.id}">
        <span class="name">${esc(t.name)}<br><span class="path">${esc(t.file)}</span></span>
        <span class="dim">${Math.round(t.rate)}Hz</span>
        <button class="danger" data-stop="${t.id}">åæ­¢</button>
      </div>`).join('') : '<div class="empty">é²é³ãã¦ãã¾ãã</div>';

    $('#start').disabled = sel.size === 0;
  }catch(e){ /* rec ãçµäºãã */ }
}

$('#apps').addEventListener('click', e => {
  const row = e.target.closest('.row'); if(!row) return;
  const id = +row.dataset.id;
  const cb = row.querySelector('input');
  if(e.target !== cb) cb.checked = !cb.checked;
  cb.checked ? sel.add(id) : sel.delete(id);
  $('#start').disabled = sel.size === 0;
});

$('#start').onclick = async () => {
  const ids = [...sel].join(',');
  sel.clear();
  const r = await j('/start?apps=' + encodeURIComponent(ids));
  if(r.failed && r.failed.length) alert('å¤±æ: ' + r.failed.join(', '));
  refresh();
};

$('#tracks').addEventListener('click', async e => {
  const b = e.target.closest('[data-stop]'); if(!b) return;
  await j('/remove?id=' + b.dataset.stop);
  refresh();
});

$('#reload').onclick = refresh;
$('#quit').onclick = async () => { await j('/quit'); };
refresh();
setInterval(refresh, 1500);
</script>
